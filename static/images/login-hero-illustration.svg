<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" width="540" height="400" fill="none">
  <!-- Gradients & Filters -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14532D" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#102A22" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F8F4"/>
    </linearGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#059669" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark Forest Green Perspective Background Floor -->
  <rect width="540" height="400" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle Topographic & Cadastral Grid Lines -->
  <g opacity="0.2" stroke="#22C55E" stroke-width="1.2">
    <path d="M-20 320 Q 140 240 300 280 T 560 260" fill="none"/>
    <path d="M-20 360 Q 180 300 360 330 T 560 310" fill="none"/>
    <path d="M40 80 Q 200 40 380 90 T 560 60" fill="none"/>
    <circle cx="120" cy="140" r="90" fill="none" stroke-dasharray="4 4"/>
    <circle cx="440" cy="280" r="120" fill="none" stroke-dasharray="6 4"/>
  </g>

  <!-- Agricultural Land Plots (Isometric Ground) -->
  <g transform="translate(60, 210)">
    <!-- Plot 1 - Emerald Crop Field -->
    <polygon points="40,90 140,40 220,80 120,130" fill="#059669" fill-opacity="0.5" stroke="#22C55E" stroke-width="2"/>
    <line x1="80" y1="70" x2="180" y2="110" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- Plot 2 - Wetland Irrigation Plot -->
    <polygon points="140,40 240,-10 320,30 220,80" fill="#22C55E" fill-opacity="0.25" stroke="#22C55E" stroke-width="2"/>
    
    <!-- Plot 3 - Gold Harvested Zone -->
    <polygon points="220,80 320,30 400,70 300,120" fill="#F5B942" fill-opacity="0.3" stroke="#F5B942" stroke-width="2"/>
    
    <!-- Cadastral Survey Pegs -->
    <circle cx="40" cy="90" r="4.5" fill="#F5B942" stroke="#102A22" stroke-width="1.5"/>
    <circle cx="140" cy="40" r="4.5" fill="#F5B942" stroke="#102A22" stroke-width="1.5"/>
    <circle cx="240" cy="-10" r="4.5" fill="#F5B942" stroke="#102A22" stroke-width="1.5"/>
    <circle cx="320" cy="30" r="4.5" fill="#F5B942" stroke="#102A22" stroke-width="1.5"/>
    <circle cx="400" cy="70" r="4.5" fill="#F5B942" stroke="#102A22" stroke-width="1.5"/>
    <circle cx="300" cy="120" r="4.5" fill="#F5B942" stroke="#102A22" stroke-width="1.5"/>
    <circle cx="120" cy="130" r="4.5" fill="#F5B942" stroke="#102A22" stroke-width="1.5"/>
  </g>

  <!-- Central Digitized Land Record Floating Certificate -->
  <g transform="translate(160, 50)" filter="url(#shadowGlow)">
    <!-- Document Card -->
    <rect x="0" y="0" width="220" height="260" rx="16" fill="url(#docGrad)" stroke="#059669" stroke-width="2.5"/>
    
    <!-- Document Folded Corner -->
    <path d="M170 0V38H220" fill="#D1FAE5" stroke="#059669" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="170,38 220,38 170,0" fill="#F5B942" fill-opacity="0.3"/>

    <!-- Document Header Ribbon -->
    <rect x="20" y="24" width="135" height="12" rx="4" fill="#14532D"/>
    <rect x="20" y="44" width="90" height="8" rx="3" fill="#059669"/>

    <!-- Government Emblem Watermark -->
    <circle cx="110" cy="125" r="32" fill="#D1FAE5" fill-opacity="0.6"/>
    <circle cx="110" cy="125" r="24" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M110 105L118 120H102Z" fill="#14532D"/>

    <!-- Survey Schedule Rows -->
    <rect x="20" y="68" width="180" height="24" rx="6" fill="#F3F8F4" stroke="#D1FAE5" stroke-width="1"/>
    <line x1="28" y1="80" x2="80" y2="80" stroke="#14532D" stroke-width="2" stroke-linecap="round"/>
    <line x1="120" y1="80" x2="190" y2="80" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Text Rows -->
    <line x1="20" y1="104" x2="190" y2="104" stroke="#D1FAE5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="116" x2="160" y2="116" stroke="#D1FAE5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="128" x2="180" y2="128" stroke="#D1FAE5" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Verification Badge Box inside Certificate -->
    <rect x="20" y="195" width="180" height="42" rx="10" fill="#14532D"/>
    <circle cx="44" cy="216" r="12" fill="#22C55E"/>
    <path d="M39 216L42.5 219.5L49 213" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="66" y="210" width="85" height="6" rx="2" fill="#FFFFFF"/>
    <rect x="66" y="220" width="60" height="5" rx="2" fill="#D1FAE5"/>
    <rect x="168" y="206" width="22" height="20" rx="3" fill="#F5B942"/>
  </g>

  <!-- Laser / OCR Scanning Beam Effect -->
  <line x1="130" y1="170" x2="410" y2="170" stroke="#22C55E" stroke-width="3" stroke-linecap="round"/>
  <rect x="130" y="166" width="280" height="8" fill="url(#emeraldGlow)"/>

  <!-- Satellite / Smart Verification Beacon -->
  <g transform="translate(390, 80)">
    <circle cx="20" cy="20" r="28" fill="#22C55E" fill-opacity="0.15"/>
    <circle cx="20" cy="20" r="18" fill="#14532D" stroke="#22C55E" stroke-width="2"/>
    <path d="M12 20C12 15.5 15.5 12 20 12" stroke="#F5B942" stroke-width="2" stroke-linecap="round"/>
    <path d="M10 20C10 14.5 14.5 10 20 10" stroke="#22C55E" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="20" cy="20" r="5" fill="#22C55E"/>
  </g>

  <!-- Tamil Revenue Tag Accent -->
  <g transform="translate(30, 40)">
    <rect x="0" y="0" width="105" height="32" rx="16" fill="#102A22" stroke="#22C55E" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#22C55E"/>
    <text x="28" y="20" fill="#D1FAE5" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">AI VERIFIED</text>
  </g>
</svg>
